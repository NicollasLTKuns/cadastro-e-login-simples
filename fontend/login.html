<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro e login simples</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="cabecalho">
        <h1>Fazer Login</h1>
    </header>
    <div id="card">
        <form id="campos">
    
            <input type="text" class="campos" placeholder="Usuário ou email">
    
            <div class="senha-container">
                <input type="password" class="campos" id="senha" placeholder="Senha">
                <button type="button" id="mostrar-senha">👁</button>
            </div>
    
            <div id="caminho">
                <p>Já possui uma conta?</p>
                <a href="cadastro.html">Entrar</a>
            </div>
    
            <input type="submit" value="Entrar" id="entrar">
    
        </form>
    </div>
    <script type="module" src="js/script.js"></script>
</body>
</html>
