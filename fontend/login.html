<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro e login simples</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="cabecalho">
        <h1>Fazer Login</h1>
    </header>
    <div id="card">
        <form id="campos-login">
    
            <input type="text" autocomplete="username" class="campos-login" id="nome-email" placeholder="Usuário ou email" required>
    
            <div class="senha-container">
                <input type="password" autocomplete="current-password" class="campos-login" id="senha" placeholder="Senha" required>
                <button type="button" id="mostrar-senha">👁</button>
            </div>
    
            <div id="caminho">
                <p>Ainda não possui uma conta?</p>
                <a href="cadastro.html">Criar conta</a>
            </div>
    
            <input type="submit" value="Entrar" id="entrar">
    
        </form>
    </div>
    <script type="module" src="js/script.js"></script>
</body>
</html>
